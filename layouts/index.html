{{ define "main" }}
<section class="posts-section">
  {{ $posts := where .Site.RegularPages "Section" "posts" }}
  {{ if gt (len $posts) 0 }}
    <ul class="post-list" role="list">
      {{ range $posts.ByDate.Reverse }}
        <li class="post-item">
          <a href="{{ .RelPermalink }}" class="post-link">{{ .Title }}</a>
          {{ partial "relative-time.html" . }}
        </li>
      {{ end }}
    </ul>
  {{ else }}
    <p class="empty">{{ i18n "no_posts" | default "暂无文章。" }}</p>
  {{ end }}
</section>
{{ end }}
