{{ define "main" }}
{{ $isPost := eq .Section "posts" }}
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{ if $isPost }}
      {{ partial "relative-time.html" . }}
    {{ end }}
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
