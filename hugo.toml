baseURL = "https://jjylab.com/"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
title = "JJy"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[outputs]
home = ["HTML", "RSS"]
section = ["HTML", "RSS"]

[permalinks]
posts = "/posts/:slugorcontentbasename/"

[languages]
  [languages.zh]
    locale = "zh-CN"
    label = "中文"
    contentDir = "content"
    weight = 1
    title = "JJy"
    [languages.zh.params]
      description = "JJy · 独立学者 | AI | 游戏"

  [languages.en]
    locale = "en"
    label = "English"
    contentDir = "content"
    weight = 2
    title = "JJy"
    [languages.en.params]
      description = "JJy · Independent Thinker | AI | Gaming"

[params]
name = "JJy"
github = "https://github.com/jjyr"
x = "https://x.com/jjybtw"
twitter = "@jjybtw"
email = "jjyruby@gmail.com"
avatar = "/images/jjybtw-avatar.jpg"
ogImage = "/images/og-default.jpg"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
