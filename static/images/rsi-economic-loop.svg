<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750" width="100%" height="100%">
  <defs>
    <!-- Hand-drawn style markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8" fill="none" stroke="#27272a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="960" height="750" fill="#ffffff"/>

  <!-- ==================== TITLE (Clean, Frameless) ==================== -->
  <g transform="translate(480, 42)">
    <text x="0" y="0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="800" fill="#18181b" letter-spacing="1">
      RSI: The Economic Loop &amp; Deadlock
    </text>
    <path d="M -160 12 C -60 14, 60 10, 160 12" stroke="#d4d4d8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ==================== UPPER SECTION: INPUTS (Visual-First, Frameless) ==================== -->

  <!-- LEFT: COST (Frameless, Doodles + Single Words) -->
  <g transform="translate(100, 100)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800" fill="#71717a" letter-spacing="1.5">
      [ COST ]
    </text>

    <!-- Item 1: Power -->
    <g transform="translate(0, 22)">
      <!-- Power tower / lightning doodle -->
      <g stroke="#18181b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 14 2 L 6 15 L 14 15 L 10 27 L 22 12 L 14 12 Z" fill="#fef08a" stroke="#ca8a04"/>
      </g>
      <text x="34" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#18181b">
        Power
      </text>
    </g>

    <!-- Item 2: Chips -->
    <g transform="translate(0, 68)">
      <!-- Microchip doodle -->
      <g stroke="#2563eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#eff6ff">
        <rect x="5" y="5" width="18" height="18" rx="2"/>
        <line x1="1" y1="10" x2="5" y2="10"/><line x1="1" y1="18" x2="5" y2="18"/>
        <line x1="23" y1="10" x2="27" y2="10"/><line x1="23" y1="18" x2="27" y2="18"/>
        <line x1="10" y1="1" x2="10" y2="5"/><line x1="18" y1="1" x2="18" y2="5"/>
        <line x1="10" y1="23" x2="10" y2="27"/><line x1="18" y1="23" x2="18" y2="27"/>
      </g>
      <text x="34" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#18181b">
        Chips (TSMC)
      </text>
    </g>

    <!-- Item 3: Hardware & Datacenter -->
    <g transform="translate(0, 114)">
      <!-- Stacked hardware layers doodle -->
      <g stroke="#4b5563" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#f3f4f6">
        <rect x="5" y="3" width="18" height="5" rx="1"/>
        <rect x="5" y="10" width="18" height="5" rx="1"/>
        <rect x="5" y="17" width="18" height="5" rx="1"/>
      </g>
      <text x="34" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#18181b">
        Infrastructure
      </text>
    </g>
  </g>

  <!-- RIGHT: REVENUE (Frameless, Doodles + Single Words) -->
  <g transform="translate(680, 100)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800" fill="#71717a" letter-spacing="1.5">
      [ REVENUE ]
    </text>

    <!-- Item 1: Labor Replacement -->
    <g transform="translate(0, 20)">
      <!-- Stick figure walking away from terminal -->
      <g stroke="#16a34a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="6" cy="5" r="3"/>
        <line x1="6" y1="8" x2="5" y2="15"/>
        <line x1="5" y1="15" x2="2" y2="22"/><line x1="5" y1="15" x2="9" y2="21"/>
        <rect x="14" y="7" width="10" height="8" rx="1"/>
        <line x1="16" y1="18" x2="22" y2="18"/>
      </g>
      <text x="34" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#18181b">
        Labor Savings
      </text>
    </g>

    <!-- Item 2: API Subscriptions -->
    <g transform="translate(0, 68)">
      <!-- Dollar coin doodle -->
      <g stroke="#16a34a" stroke-width="1.4" fill="#ecfdf5">
        <circle cx="14" cy="14" r="10"/>
        <text x="14" y="18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" fill="#16a34a" stroke="none">$</text>
      </g>
      <text x="34" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#18181b">
        API Subscriptions
      </text>
    </g>

    <!-- Item 3: Productivity Surplus -->
    <g transform="translate(0, 114)">
      <!-- Upward graph doodle -->
      <g stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 4 22 L 24 22"/>
        <path d="M 4 22 L 4 6"/>
        <polyline points="5,18 11,13 16,16 23,7"/>
        <polyline points="19,7 23,7 23,11"/>
      </g>
      <text x="34" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#18181b">
        Productivity Surplus
      </text>
    </g>
  </g>

  <!-- ==================== FLOW CONNECTORS: INFLOW TO AI ENGINE ==================== -->
  <!-- Left Cost -> AI Engine -->
  <path d="M 260 165 L 390 165" fill="none" stroke="#27272a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="325" y="155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#dc2626">-$ DRAIN</text>

  <!-- AI Engine -> Right Revenue -->
  <path d="M 570 165 L 670 165" fill="none" stroke="#27272a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="620" y="155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#16a34a">+$ RETURN</text>

  <!-- ==================== CENTER: AI ENGINE ==================== -->
  <g transform="translate(480, 165)">
    <!-- Minimalist Hand-drawn Core Badge -->
    <path d="M -75 -24 L 75 -24 C 80 -24, 80 24, 75 24 L -75 24 C -80 24, -80 -24, -75 -24 Z" fill="#ffffff" stroke="#18181b" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Microprocessor / Core icon -->
    <g transform="translate(-60, -11)" stroke="#18181b" stroke-width="1.4" fill="none">
      <rect x="0" y="0" width="22" height="22" rx="2" fill="#f4f4f5"/>
      <circle cx="11" cy="11" r="4" fill="#27272a"/>
    </g>

    <text x="12" y="5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800" fill="#18181b">
      AI Engine
    </text>
  </g>

  <!-- ==================== THE BALANCE SCALE (Visual Core) ==================== -->
  <!-- Downward arrow to scale -->
  <path d="M 480 190 L 480 230" fill="none" stroke="#27272a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(480, 235)">
    <!-- Hand-Drawn Balance Scale -->
    <g stroke="#18181b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Fulcrum Base -->
      <polygon points="0,52 -14,75 14,75" fill="#f4f4f5"/>
      <line x1="0" y1="10" x2="0" y2="52"/>
      <!-- Balance Beam (Slight tilt to give life) -->
      <line x1="-70" y1="16" x2="70" y2="8"/>
      <circle cx="0" cy="12" r="3" fill="#18181b"/>
      
      <!-- Left Pan (Cost) -->
      <line x1="-70" y1="16" x2="-85" y2="40"/>
      <line x1="-70" y1="16" x2="-55" y2="40"/>
      <path d="M -90 40 L -50 40 C -55 52, -85 52, -90 40 Z" fill="#fee2e2" stroke="#dc2626"/>
      <!-- Small weight inside pan -->
      <rect x="-74" y="30" width="8" height="10" rx="1" fill="#f87171" stroke="#dc2626"/>

      <!-- Right Pan (Revenue) -->
      <line x1="70" y1="8" x2="55" y2="32"/>
      <line x1="70" y1="8" x2="85" y2="32"/>
      <path d="M 50 32 L 90 32 C 85 44, 55 44, 50 32 Z" fill="#dcfce7" stroke="#16a34a"/>
      <!-- Small coin inside pan -->
      <circle cx="70" cy="24" r="6" fill="#4ade80" stroke="#16a34a"/>
    </g>

    <!-- Formula Text (Subtle, Clean) -->
    <text x="0" y="98" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800" fill="#18181b">
      Profit = Revenue - Cost
    </text>
  </g>

  <!-- ==================== THE FORK (DIVERGING ARROWS) ==================== -->
  <path d="M 480 345 L 480 375 L 250 375 L 250 410" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <path d="M 480 375 L 710 375 L 710 410" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
  <circle cx="480" cy="375" r="4" fill="#27272a"/>

  <!-- ==================== HERO OUTCOME 1 (LEFT): PROFIT > 0 ==================== -->
  <g transform="translate(140, 420)">
    <!-- Big Hand-drawn Flywheel Illustration -->
    <g transform="translate(110, 50)">
      <!-- Swirling circular arrows -->
      <circle cx="0" cy="0" r="32" stroke="#bbf7d0" stroke-width="3" fill="#f0fdf4"/>
      <g stroke="#15803d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Curved Arrow 1 -->
        <path d="M 0 -32 C 18 -32, 32 -18, 32 0"/>
        <polyline points="26,-4 32,2 38,-4"/>
        <!-- Curved Arrow 2 -->
        <path d="M 0 32 C -18 32, -32 18, -32 0"/>
        <polyline points="-26,4 -32,-2 -38,4"/>
        <!-- Center hub -->
        <circle cx="0" cy="0" r="8" fill="#15803d"/>
      </g>
    </g>

    <!-- Punchy Labels (Minimal Words) -->
    <text x="110" y="115" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="900" fill="#15803d">
      Profit &gt; 0
    </text>
    <text x="110" y="138" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800" fill="#14532d">
      Next-Gen RSI
    </text>
    <text x="110" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#4b5563">
      Reinvest capital → Scale bigger clusters
    </text>
  </g>

  <!-- ==================== HERO OUTCOME 2 (RIGHT): PROFIT <= 0 ==================== -->
  <g transform="translate(600, 420)">
    <!-- Big Hand-drawn Padlock & Brick Wall Illustration -->
    <g transform="translate(110, 50)">
      <!-- Brick Wall Doodle -->
      <g stroke="#fecaca" stroke-width="2" fill="#fef2f2">
        <rect x="-35" y="-22" width="70" height="48" rx="3"/>
        <line x1="-35" y1="-6" x2="35" y2="-6" stroke="#fca5a5"/>
        <line x1="-35" y1="10" x2="35" y2="10" stroke="#fca5a5"/>
        <line x1="-12" y1="-22" x2="-12" y2="-6" stroke="#fca5a5"/>
        <line x1="12" y1="-22" x2="12" y2="-6" stroke="#fca5a5"/>
        <line x1="0" y1="-6" x2="0" y2="10" stroke="#fca5a5"/>
        <line x1="-18" y1="10" x2="-18" y2="26" stroke="#fca5a5"/>
        <line x1="18" y1="10" x2="18" y2="26" stroke="#fca5a5"/>
      </g>
      <!-- Sturdy Padlock on Wall -->
      <g stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="-14" y="-4" width="28" height="24" rx="3" fill="#fee2e2"/>
        <path d="M -8 -4 L -8 -16 C -8 -23, 8 -23, 8 -16 L 8 -4"/>
        <circle cx="0" cy="6" r="2.5" fill="#b91c1c"/>
      </g>
    </g>

    <!-- Punchy Labels (Minimal Words) -->
    <text x="110" y="115" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="900" fill="#b91c1c">
      Profit ≤ 0
    </text>
    <text x="110" y="138" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800" fill="#991b1b">
      "Local Optimum" Trap
    </text>
    <text x="110" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#4b5563">
      "Good enough &amp; cheap" → Evolution stops
    </text>
  </g>

  <!-- ==================== DYNAMIC REINVESTMENT LOOP (THE GRAND WIRE) ==================== -->
  <!-- Sweeping loop from Profit > 0 back to top-left Cost input -->
  <path d="M 200 620 L 200 670 L 40 670 L 40 180 L 85 180" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#arrow-green)"/>
  <circle cx="200" cy="620" r="4" fill="#15803d"/>

  <!-- Loop Label (Frameless Text) -->
  <g transform="translate(48, 655)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="800" fill="#15803d" letter-spacing="0.5">
      ↺ Reinvestment Loop (Enters More Expensive Cycle)
    </text>
  </g>

</svg>
